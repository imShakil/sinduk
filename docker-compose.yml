version: '3.8'

services:
  sinduk-server:
    build: .
    image: sinduk/server:latest
    container_name: sinduk-sync-server
    restart: unless-stopped
    ports:
      - "58380:58380"
    volumes:
      - sinduk_data:/data
    environment:
      - SINDUK_HOST=0.0.0.0
      - SINDUK_PORT=58380

volumes:
  sinduk_data:
    driver: local
