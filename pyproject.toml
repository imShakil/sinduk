[project]
name = "pacli-tool"
dynamic = ["version"]
description = "pacli-tool has been renamed to sinduk. This transition package installs sinduk."
readme = "README.md"
authors = [
    { name = "Mobarak Hosen Shakil", email = "mh.ice.iu@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]

requires-python = ">=3.10"
dependencies = [
    "sinduk>=2.0.0",
]
keywords = ["cli", "secrets", "encryption", "password", "token", "clipboard", "security", "vault", "sinduk", "pacli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Security :: Cryptography",
    "Topic :: Utilities",
    "Development Status :: 7 - Inactive"
]

[project.urls]
Homepage = "https://github.com/imshakil/sinduk"
Issues = "https://github.com/imshakil/sinduk/issues"

[project.scripts]
sinduk = "sinduk.cli:cli"
pacli = "sinduk.cli:cli"

[build-system]
requires = ["setuptools>=61.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pacli*"]
exclude = ["ref*", "tests*", "docs*", "sinduk*"]

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "no-local-version"

[tool.mypy]
ignore_missing_imports = true
